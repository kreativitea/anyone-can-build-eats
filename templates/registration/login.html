{% extends "base.html" %}
{% block title %}Log in · Gaidai Eats{% endblock %}
{% block content %}
<h1>Log in</h1>
<form class="form" method="post">
  {% csrf_token %}
  {% for error in form.non_field_errors %}<div class="message message--error">{{ error }}</div>{% endfor %}
  {% include "registration/_form_fields.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="row">
    <button class="btn btn--primary" type="submit">Log in</button>
    <a class="btn btn--ghost" href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">New here? Sign up</a>
  </div>
</form>
{% endblock %}
